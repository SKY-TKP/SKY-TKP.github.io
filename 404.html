<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070c16">
    <meta name="robots" content="noindex">
    <title>Page not found · Thananop Kullapan</title>
    <link rel="icon" href="/profile.png">

    <!-- Absolute paths: GitHub Pages serves this page for any missing URL, at any depth -->
    <link rel="stylesheet" href="/assets/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="/assets/vendor/boxicons/css/boxicons.min.css">
    <style>
        :root {
            --bg-main: #070c16;
            --card-bg-2: #13203a;
            --border-strong: rgba(148, 163, 184, 0.24);
            --text-strong: #f5f8fc;
            --text-muted: #9cacc1;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --accent-ink: #03111d;
            --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            background:
                linear-gradient(180deg, rgba(7, 12, 22, 0.55), rgba(7, 12, 22, 0.85)),
                url("/assets/img/hero-sky.jpg") center bottom / cover no-repeat,
                var(--bg-main);
            color: var(--text-strong);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        main { max-width: 560px; animation: rise 0.7s var(--ease) both; }
        .code {
            font-family: "Plus Jakarta Sans", "Inter", sans-serif;
            font-size: clamp(5rem, 22vw, 9rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.06em;
            background: linear-gradient(100deg, #ffffff 0%, #bae6fd 50%, #ffffff 100%);
            background-size: 220% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 7s ease-in-out infinite;
        }
        h1 {
            margin-top: 12px;
            font-family: "Plus Jakarta Sans", "Inter", sans-serif;
            font-size: clamp(1.4rem, 4.5vw, 2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
        }
        p.lead { margin-top: 12px; color: var(--text-muted); font-size: 1.05rem; line-height: 1.7; }
        .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 46px;
            padding: 0 22px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            background: var(--card-bg-2);
            color: var(--text-strong);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s var(--ease), background-color 0.2s var(--ease), border-color 0.2s var(--ease);
        }
        .btn i { font-size: 19px; }
        .btn:hover { transform: translateY(-2px); border-color: var(--accent); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
        .btn.primary:hover { background: var(--accent-hover); }
        .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
        @keyframes shimmer { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0% 0; } }
        @media (prefers-reduced-motion: reduce) { main, .code { animation: none; } }
    </style>
</head>
<body>
    <main>
        <p class="code" aria-hidden="true">404</p>
        <h1>This page drifted off into space</h1>
        <p class="lead">The link may be broken, or the page may have moved.</p>
        <div class="actions">
            <a class="btn primary" href="/"><i class="bx bx-home" aria-hidden="true"></i> Back to home</a>
            <a class="btn" href="/#portfolio"><i class="bx bx-briefcase" aria-hidden="true"></i> View projects</a>
        </div>
    </main>
</body>
</html>
